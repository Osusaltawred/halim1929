<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>أرشيف عبد الحليم حافظ</title>
<meta name="description" content="أرشيف رقمي لأغاني عبد الحليم حافظ وحفلاته ومقابلاته وصوره ومصادرها.">
<meta name="theme-color" content="#12263a">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@400;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap">
<link rel="stylesheet" href="/css/app.css">
</head>
<body>
<a class="skip" href="#view">تخطي إلى المحتوى</a>

<header class="top" id="top">
  <div class="top__row">
    <a class="brand" href="#/" aria-label="الصفحة الرئيسية">
      <span class="brand__name" id="brand-name">عبد الحليم حافظ</span>
      <span class="brand__tag" id="brand-tag">الأرشيف الرقمي</span>
    </a>
    <div class="search" role="search">
      <span class="search__ic" id="search-ic"></span>
      <input id="q" type="search" inputmode="search" enterkeyhint="search" autocomplete="off" spellcheck="false"
             placeholder="ابحث في الأرشيف: أغنية، ملحن، سنة، حفلة..." aria-label="بحث في الأرشيف" aria-controls="suggest" aria-expanded="false">
      <div id="suggest" class="suggest" hidden></div>
    </div>
  </div>
  <nav class="nav" id="nav" aria-label="أقسام الموقع"></nav>
</header>

<main id="view" tabindex="-1"></main>

<footer class="foot" id="foot"></footer>

<div id="player" class="player" hidden></div>
<button id="player-fab" class="player-fab" hidden aria-label="إظهار المشغل"></button>
<audio id="audio" preload="none"></audio>

<script type="module" src="/js/app.js"></script>
</body>
</html>
